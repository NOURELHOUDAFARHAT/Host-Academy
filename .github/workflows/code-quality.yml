name: Code Quality & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security checks weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  # Code Quality Analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (Backend)
        working-directory: ./api
        run: npm ci

      - name: Install dependencies (Frontend)
        working-directory: ./Client
        run: npm ci

      - name: ESLint Analysis (Frontend)
        working-directory: ./Client
        run: |
          # Create ESLint report
          npx eslint src/ --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true
          echo "ESLint analysis completed"

      - name: Prettier Check (Frontend)
        working-directory: ./Client
        run: |
          # Check if code is formatted
          npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}" || echo "Prettier formatting issues found"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Security Vulnerability Scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=api/package.json

      - name: Run Snyk for frontend
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=Client/package.json

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif

  # License Compliance Check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install license checker
        run: npm install -g license-checker

      - name: Check backend licenses
        working-directory: ./api
        run: |
          npm ci
          license-checker --summary --excludePrivatePackages

      - name: Check frontend licenses
        working-directory: ./Client
        run: |
          npm ci
          license-checker --summary --excludePrivatePackages

  # Performance Analysis
  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./Client
        run: npm ci

      - name: Build application
        working-directory: ./Client
        run: npm run build

      - name: Serve application
        working-directory: ./Client
        run: |
          npm install -g serve
          serve -s build -p 3000 &
          sleep 10

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Dependency Update Check
  dependency-check:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check for outdated packages (Backend)
        working-directory: ./api
        run: |
          npm ci
          npm outdated || true

      - name: Check for outdated packages (Frontend)
        working-directory: ./Client
        run: |
          npm ci
          npm outdated || true

      - name: Create issue for outdated dependencies
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            
            try {
              const backendOutdated = execSync('cd api && npm outdated --json', { encoding: 'utf8' });
              const frontendOutdated = execSync('cd Client && npm outdated --json', { encoding: 'utf8' });
              
              if (backendOutdated || frontendOutdated) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '🔄 Weekly Dependency Update Check',
                  body: `## Outdated Dependencies Found\n\n### Backend:\n\`\`\`json\n${backendOutdated}\n\`\`\`\n\n### Frontend:\n\`\`\`json\n${frontendOutdated}\n\`\`\`\n\nPlease review and update these dependencies.`,
                  labels: ['dependencies', 'maintenance']
                });
              }
            } catch (error) {
              console.log('No outdated dependencies found or error occurred:', error.message);
            }
