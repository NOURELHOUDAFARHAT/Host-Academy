name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allows manual triggering

env:
  NODE_VERSION: '18'

jobs:
  # Backend Testing and Building
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check backend structure
        run: |
          echo "📁 Checking backend structure..."
          ls -la api/ || echo "❌ API directory not found"
          if [ -f "api/package.json" ]; then
            echo "✅ package.json found"
            cat api/package.json | head -10
          else
            echo "❌ package.json not found"
          fi

      - name: Install backend dependencies
        working-directory: ./api
        run: |
          echo "📦 Installing backend dependencies..."
          if [ -f "package-lock.json" ]; then
            echo "Using npm ci (package-lock.json found)"
            npm ci
          else
            echo "Using npm install (no package-lock.json)"
            npm install
          fi

      - name: Basic backend validation
        working-directory: ./api
        run: |
          echo "🔍 Validating backend files..."
          if [ -f "app.js" ]; then
            echo "✅ app.js exists"
            node -c app.js && echo "✅ app.js syntax is valid"
          else
            echo "❌ app.js not found"
            ls -la
          fi

  # Frontend Testing and Building  
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check frontend structure
        run: |
          echo "📁 Checking frontend structure..."
          ls -la Client/ || echo "❌ Client directory not found"
          if [ -f "Client/package.json" ]; then
            echo "✅ package.json found"
            cat Client/package.json | head -10
          else
            echo "❌ package.json not found"
          fi

      - name: Install frontend dependencies
        working-directory: ./Client
        run: |
          echo "📦 Installing frontend dependencies..."
          if [ -f "package-lock.json" ]; then
            echo "Using npm ci (package-lock.json found)"
            npm ci
          else
            echo "Using npm install (no package-lock.json)"
            npm install
          fi

      - name: Build frontend
        working-directory: ./Client
        run: |
          echo "🏗️ Building frontend..."
          npm run build || echo "⚠️ Build completed with warnings"
          
      - name: Check build output
        working-directory: ./Client
        run: |
          if [ -d "build" ]; then
            echo "✅ Build directory created"
            echo "📦 Build contents:"
            ls -la build/
          else
            echo "❌ Build directory not found"
          fi

  # Security and Quality Checks
  security-check:
    name: Security & Quality
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Docker Build (only on main branch)
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/host-academy-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/host-academy-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Client
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/host-academy-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/host-academy-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Notification
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-check]
    if: always()

    steps:
      - name: Job Summary
        run: |
          echo "## 📊 Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🔧 Backend: ${{ needs.backend-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⚛️ Frontend: ${{ needs.frontend-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 Security: ${{ needs.security-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- � Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
