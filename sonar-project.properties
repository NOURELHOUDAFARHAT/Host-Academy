sonar.projectKey=host-academy
sonar.organization=your-org # Replace with your SonarCloud organization
sonar.projectName=Host Academy E-Learning Platform
sonar.projectVersion=1.0

# Source code
sonar.sources=Client/src,api
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.test.js,**/*.spec.js

# Test coverage
sonar.javascript.lcov.reportPaths=Client/coverage/lcov.info

# Language settings
sonar.sourceEncoding=UTF-8

# Additional settings
sonar.scm.provider=git
